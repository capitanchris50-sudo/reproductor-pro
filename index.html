<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor Pro</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        :root {
            --theme-color: #00d2ff;
            --theme-glow: rgba(0, 210, 255, 0.4);
        }

        body {
            background: #0b0b0e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
        }

        .main-container {
            width: 100%;
            max-width: 380px;
            background: rgba(22, 22, 28, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px 8px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .menu-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .menu-btn:active { transform: scale(0.9); background: var(--theme-glow); }
        
        .app-title-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .app-logo {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            object-fit: cover;
        }
        .app-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--theme-color);
            text-transform: uppercase;
        }
        .placeholder-space { width: 32px; }

        .dropdown-menu {
            position: absolute;
            top: 50px;
            left: 12px;
            background: rgba(28, 28, 36, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 240px;
            z-index: 100;
            display: none;
            padding: 8px;
            box-sizing: border-box;
            animation: fadeIn 0.2s ease;
        }
        .dropdown-menu.show { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .menu-section-title {
            font-size: 10px;
            color: #8e8e93;
            text-transform: uppercase;
            padding: 6px 8px 2px 8px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .menu-item {
            padding: 8px 10px;
            font-size: 12px;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.15s;
        }
        .menu-item:active { background: var(--theme-glow); color: var(--theme-color); transform: scale(0.97); }
        
        .color-picker-row {
            display: flex;
            gap: 8px;
            padding: 6px 8px;
            justify-content: space-between;
        }
        .color-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.2);
            transition: transform 0.2s;
        }
        .color-dot:active { transform: scale(0.85); }

        .win-credits {
            margin-top: 6px;
            padding: 8px 10px;
            background: rgba(120, 120, 130, 0.12);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-size: 11px;
            color: #a0a0ab;
            text-align: right;
            line-height: 1.3;
            user-select: none;
            backdrop-filter: blur(5px);
        }
        .win-credits span {
            display: block;
            font-weight: 600;
            color: #c0c0cb;
        }

        .player-panel {
            padding: 14px 20px 10px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: rgba(255,255,255,0.01);
        }
        .album-art {
            width: 120px;
            height: 120px;
            background: #1c1c24;
            border-radius: 20px;
            margin-bottom: 10px;
            background-size: cover;
            background-position: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            border: 1px solid rgba(255,255,255,0.06);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .album-art:active { transform: scale(0.95); }

        h2 { margin: 0 0 2px 0; font-size: 14px; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        p { color: #8e8e93; font-size: 11px; margin: 0 0 8px 0; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .progress-container {
            width: 100%;
            margin-bottom: 10px;
        }
        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #8e8e93;
            margin-bottom: 4px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            appearance: none;
            outline: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-runnable-track {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            height: 6px;
        }

        .progress-bar::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--theme-color);
            cursor: pointer;
            box-shadow: 0 0 10px var(--theme-glow);
            border: 2px solid #ffffff;
            margin-top: -5px;
            transition: transform 0.1s ease;
        }
        
        .progress-bar::-webkit-slider-thumb:active {
            transform: scale(1.3);
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }
        .control-btn {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .control-btn:active { transform: scale(0.85); background: var(--theme-glow); }
        .play-main { width: 44px; height: 44px; background: var(--theme-color); color: #000; font-size: 15px; border: none; box-shadow: 0 4px 15px var(--theme-glow); }

        .top-tabs {
            display: flex;
            background: rgba(14, 14, 18, 0.9);
            padding: 8px 10px;
            border-top: 1px solid rgba(255,255,255,0.06);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            justify-content: space-around;
            align-items: center;
        }
        .tabs-left { display: flex; gap: 4px; width: 100%; justify-content: space-between; }
        .tab-btn {
            background: transparent;
            border: none;
            color: #8e8e93;
            padding: 8px 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.25s ease;
        }
        .tab-btn.active { color: var(--theme-color); background: var(--theme-glow); backdrop-filter: blur(5px); }

        .content-body {
            display: flex;
            flex-direction: column;
            background: rgba(12, 12, 15, 0.5);
        }
        .sidebar-view {
            width: 100%;
            max-height: 150px;
            overflow-y: auto;
            padding: 10px;
            box-sizing: border-box;
        }
        
        .list-item {
            padding: 10px 12px;
            font-size: 12px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 5px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.02);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .list-item:active { transform: scale(0.97); background: rgba(255,255,255,0.08); }
        .list-item.active { background: var(--theme-glow); color: var(--theme-color); font-weight: 600; border-color: rgba(0,210,255,0.3); }

        .add-section {
            padding: 10px 12px;
            background: rgba(10, 10, 12, 0.8);
            border-top: 1px solid rgba(255,255,255,0.04);
            text-align: center;
        }
        .custom-file-upload {
            display: block;
            background: linear-gradient(135deg, var(--theme-color), #0088cc);
            color: #000;
            padding: 10px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 4px 15px var(--theme-glow);
            transition: transform 0.2s ease;
        }
        .custom-file-upload:active { transform: scale(0.96); }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="app-header">
            <button class="menu-btn" onclick="toggleMenu()">⚙️</button>
            <div class="app-title-area">
                <div class="app-title">Reproductor Pro</div>
                <svg class="app-logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                    <rect width="512" height="512" rx="110" fill="#00d2ff"/>
                    <circle cx="256" cy="256" r="160" fill="#000"/>
                    <circle cx="256" cy="256" r="50" fill="#00d2ff"/>
                </svg>
            </div>
            <div class="placeholder-space"></div>
        </div>

        <div class="dropdown-menu" id="dropdownMenu">
            <div class="menu-section-title">Color de Interfaz</div>
            <div class="color-picker-row">
                <div class="color-dot" style="background: #00ff88;" onclick="setTheme('#00ff88', 'rgba(0, 255, 136, 0.4)')" title="Verde Neón"></div>
                <div class="color-dot" style="background: #ff3366;" onclick="setTheme('#ff3366', 'rgba(255, 51, 102, 0.4)')" title="Rosa Neón"></div>
                <div class="color-dot" style="background: #00d2ff;" onclick="setTheme('#00d2ff', 'rgba(0, 210, 255, 0.4)')" title="Azul Ciclón"></div>
                <div class="color-dot" style="background: #ffaa00;" onclick="setTheme('#ffaa00', 'rgba(255, 170, 0, 0.4)')" title="Naranja Fuego"></div>
                <div class="color-dot" style="background: #b000ff;" onclick="setTheme('#b000ff', 'rgba(176, 0, 255, 0.4)')" title="Morado Místico"></div>
            </div>

            <div class="menu-section-title" style="margin-top: 4px;">Modo Sueño</div>
            <div class="menu-item" onclick="setSleepTimer(15)">⏱️ Apagar en 15 min</div>
            <div class="menu-item" onclick="setSleepTimer(30)">⏱️ Apagar en 30 min</div>
            <div class="menu-item" onclick="setSleepTimer(60)">⏱️ Apagar en 1 hora</div>
            <div class="menu-item" onclick="cancelSleepTimer()" style="color: #ff5252;">❌ Cancelar Temporizador</div>

            <div class="win-credits">
                Reproductor Pro v1.0<br>
                Hecho por: <span>cristopher</span><br>
                Año: <span>2026</span>
            </div>
        </div>

        <div class="player-panel">
            <div class="album-art" id="albumArt">🎵</div>
            <h2 id="songTitle">Selecciona una pista</h2>
            <p id="artistName">Artista Desconocido</p>

            <div class="progress-container">
                <div class="time-info">
                    <span id="currentTime">0:00</span>
                    <span id="durationTime">0:00</span>
                </div>
                <input type="range" id="progressBar" class="progress-bar" value="0" min="0" max="100" step="0.1">
            </div>

            <div class="controls">
                <button class="control-btn" onclick="prevSong()">⏮</button>
                <button class="control-btn play-main" id="playBtn" onclick="togglePlay()">▶</button>
                <button class="control-btn" onclick="nextSong()">⏭</button>
            </div>
            <audio id="audioPlayer"></audio>
        </div>

        <div class="content-body">
            <div class="top-tabs">
                <div class="tabs-left">
                    <button class="tab-btn active" onclick="switchTab('tracks', this)">Pistas</button>
                    <button class="tab-btn" onclick="switchTab('artists', this)">Artistas</button>
                    <button class="tab-btn" onclick="switchTab('albums', this)">Álbumes</button>
                </div>
            </div>

            <div class="sidebar-view" id="listView">
                <p style="color: #666; font-size: 12px; text-align: center; margin: 10px 0;">Cargando biblioteca...</p>
            </div>
        </div>

        <div class="add-section">
            <label class="custom-file-upload">
                + Agregar Música
                <input type="file" id="fileInput" multiple accept="audio/*">
            </label>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const audioPlayer = document.getElementById('audioPlayer');
        const songTitle = document.getElementById('songTitle');
        const artistName = document.getElementById('artistName');
        const albumArt = document.getElementById('albumArt');
        const listView = document.getElementById('listView');
        const playBtn = document.getElementById('playBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');

        let canciones = [];
        let currentIndex = 0;
        let currentTab = 'tracks';
        let sleepTimerTimeout = null;
        let isSeeking = false;
        let db = null;

        const request = indexedDB.open('ProPlayerDB', 1);

        request.onerror = function(event) {
            console.error("Error al abrir IndexedDB", event);
        };

        request.onsuccess = function(event) {
            db = event.target.result;
            cargarCancionesDesdeDB();
        };

        request.onupgradeneeded = function(event) {
            let database = event.target.result;
            if (!database.objectStoreNames.contains('canciones')) {
                database.createObjectStore('canciones', { keyPath: 'id', autoIncrement: true });
            }
        };

        const savedThemeColor = localStorage.getItem('pro_player_color');
        const savedThemeGlow = localStorage.getItem('pro_player_glow');
        if (savedThemeColor && savedThemeGlow) {
            setTheme(savedThemeColor, savedThemeGlow, false);
        }

        function toggleMenu() {
            dropdownMenu.classList.toggle('show');
        }

        window.addEventListener('click', function(e) {
            if (!e.target.closest('.app-header') && !e.target.closest('.dropdown-menu')) {
                dropdownMenu.classList.remove('show');
            }
        });

        function setTheme(color, glow, save = true) {
            document.documentElement.style.setProperty('--theme-color', color);
            document.documentElement.style.setProperty('--theme-glow', glow);
            if (save) {
                localStorage.setItem('pro_player_color', color);
                localStorage.setItem('pro_player_glow', glow);
            }
            dropdownMenu.classList.remove('show');
            actualizarRellenoBarra();
        }

        function actualizarRellenoBarra() {
            let value = (progressBar.value - progressBar.min) / (progressBar.max - progressBar.min) * 100;
            let themeColor = getComputedStyle(document.documentElement).getPropertyValue('--theme-color').trim();
            progressBar.style.background = `linear-gradient(to right, ${themeColor} ${value}%, rgba(255,255,255,0.1) ${value}%)`;
        }

        function setSleepTimer(minutes) {
            cancelSleepTimer();
            let ms = minutes * 60 * 1000;
            sleepTimerTimeout = setTimeout(() => {
                audioPlayer.pause();
                playBtn.textContent = "▶";
                alert(`Modo sueño activado: La música se detuvo tras ${minutes} minutos.`);
            }, ms);
            alert(`Temporizador configurado: se detendrá en ${minutes} minutos.`);
            dropdownMenu.classList.remove('show');
        }

        function cancelSleepTimer() {
            if (sleepTimerTimeout) {
                clearTimeout(sleepTimerTimeout);
                sleepTimerTimeout = null;
                alert("Temporizador de sueño cancelado.");
            } else {
                alert("No hay ningún temporizador activo.");
            }
            dropdownMenu.classList.remove('show');
        }

        fileInput.addEventListener('change', function(e) {
            const files = e.target.files;
            if (files.length > 0) {
                for (let file of files) {
                    jsmediatags.read(file, {
                        onSuccess: function(tag) {
                            const tags = tag.tags;
                            let pictureData = null;
                            if (tags.picture) {
                                const base64String = tags.picture.data.reduce((data, byte) => data + String.fromCharCode(byte), '');
                                pictureData = `data:${tags.picture.format};base64,${btoa(base64String)}`;
                            }
                            const nuevaCancion = {
                                file: file,
                                name: file.name.replace(/\.[^/.]+$/, ""),
                                title: tags.title || file.name.replace(/\.[^/.]+$/, ""),
                                artist: tags.artist || "Artista Desconocido",
                                album: tags.album || "Álbum Desconocido",
                                pictureUrl: pictureData
                            };
                            guardarCancionEnDB(nuevaCancion);
                        },
                        onError: function() {
                            const nuevaCancion = {
                                file: file,
                                name: file.name.replace(/\.[^/.]+$/, ""),
                                title: file.name.replace(/\.[^/.]+$/, ""),
                                artist: "Artista Desconocido",
                                album: "Álbum Desconocido",
                                pictureUrl: null
                            };
                            guardarCancionEnDB(nuevaCancion);
                        }
                    });
                }
            }
        });

        function guardarCancionEnDB(cancion) {
            if (!db) return;
            let transaction = db.transaction(['canciones'], 'readwrite');
            let store = transaction.objectStore('canciones');
            let request = store.add(cancion);

            request.onsuccess = function() {
                cargarCancionesDesdeDB();
            };
        }

        function cargarCancionesDesdeDB() {
            if (!db) return;
            let transaction = db.transaction(['canciones'], 'readonly');
            let store = transaction.objectStore('canciones');
            let request = store.getAll();

            request.onsuccess = function(event) {
                canciones = event.target.result;
                renderTab();
                if (canciones.length > 0 && (audioPlayer.src === "" || audioPlayer.src === window.location.href)) {
                    prepararCancion(0);
                }
            };
        }

        function formatTime(seconds) {
            let minutes = Math.floor(seconds / 60);
            let secs = Math.floor(seconds % 60);
            return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
        }

        audioPlayer.addEventListener('timeupdate', () => {
            if (!isSeeking && audioPlayer.duration) {
                progressBar.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
                actualizarRellenoBarra();
            }
        });

        audioPlayer.addEventListener('loadedmetadata', () => {
            durationTimeEl.textContent = formatTime(audioPlayer.duration);
        });

        progressBar.addEventListener('input', () => {
            isSeeking = true;
            if (audioPlayer.duration) {
                let time = (progressBar.value / 100) * audioPlayer.duration;
                currentTimeEl.textContent = formatTime(time);
                actualizarRellenoBarra();
            }
        });

        progressBar.addEventListener('change', () => {
            if (audioPlayer.duration) {
                audioPlayer.currentTime = (progressBar.value / 100) * audioPlayer.duration;
            }
            isSeeking = false;
            actualizarRellenoBarra();
        });

        function switchTab(tab, btn) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTab();
        }

        function renderTab() {
            listView.innerHTML = '';
            if (canciones.length === 0) {
                listView.innerHTML = '<p style="color: #666; font-size: 12px; text-align: center; margin: 10px 0;">Biblioteca vacía...</p>';
                return;
            }

            if (currentTab === 'tracks') {
                canciones.forEach((cancion, index) => {
                    let div = document.createElement('div');
                    div.className = 'list-item' + (currentIndex === index ? ' active' : '');
                    div.style.display = "flex";
                    div.style.alignItems = "center";
                    div.style.gap = "8px";
                    
                    if (cancion.pictureUrl) {
                        div.innerHTML = `<img src="${cancion.pictureUrl}" style="width:20px; height:20px; border-radius:50%; object-fit:cover; flex-shrink:0;"> <span>🎵 ${cancion.title}</span>`;
                    } else {
                        div.innerHTML = `<span>🎵 ${cancion.title}</span>`;
                    }

                    div.onclick = () => reproducirCancion(index);
                    listView.appendChild(div);
                });
            } else if (currentTab === 'artists') {
                let artistas = [...new Set(canciones.map(c => c.artist))];
                artistas.forEach(artist => {
                    let div = document.createElement('div');
                    div.className = 'list-item';
                    
                    let match = canciones.find(c => c.artist === artist && c.pictureUrl);
                    if (match && match.pictureUrl) {
                        div.style.display = "flex";
                        div.style.alignItems = "center";
                        div.style.gap = "8px";
                        div.innerHTML = `<img src="${match.pictureUrl}" style="width:20px; height:20px; border-radius:50%; object-fit:cover; flex-shrink:0;"> <span>👤 ${artist}</span>`;
                    } else {
                        div.textContent = `👤 ${artist}`;
                    }

                    div.onclick = () => {
                        let firstIndex = canciones.findIndex(c => c.artist === artist);
                        if(firstIndex !== -1) reproducirCancion(firstIndex);
                    };
                    listView.appendChild(div);
                });
            } else if (currentTab === 'albums') {
                let albumes = [...new Set(canciones.map(c => c.album))];
                albumes.forEach(album => {
                    let div = document.createElement('div');
                    div.className = 'list-thumb';
                    let divItem = document.createElement('div');
                    divItem.className = 'list-item';
                    
                    let match = canciones.find(c => c.album === album && c.pictureUrl);
                    if (match && match.pictureUrl) {
                        divItem.style.display = "flex";
                        divItem.style.alignItems = "center";
                        divItem.style.gap = "8px";
                        divItem.innerHTML = `<img src="${match.pictureUrl}" style="width:20px; height:20px; border-radius:50%; object-fit:cover; flex-shrink:0;"> <span>💿 ${album}</span>`;
                    } else {
                        divItem.textContent = `💿 ${album}`;
                    }

                    divItem.onclick = () => {
                        let firstIndex = canciones.findIndex(c => c.album === album);
                        if(firstIndex !== -1) reproducirCancion(firstIndex);
                    };
                    listView.appendChild(divItem);
                });
            }
        }

        function prepararCancion(index) {
            currentIndex = index;
            let item = canciones[index];
            if (!item.file) return;

            const fileURL = URL.createObjectURL(item.file);
            audioPlayer.src = fileURL;

            songTitle.textContent = item.title;
            artistName.textContent = item.artist;
            albumArt.style.backgroundImage = "none";
            albumArt.textContent = "🎵";

            if (item.pictureUrl) {
                albumArt.style.backgroundImage = `url(${item.pictureUrl})`;
                albumArt.textContent = "";
            }
        }

        function reproducirCancion(index) {
            prepararCancion(index);
            audioPlayer.play();
            playBtn.textContent = "⏸";
            renderTab();
        }

        function togglePlay() {
            if (audioPlayer.paused) {
                if(!audioPlayer.src || audioPlayer.src === window.location.href) {
                    if(canciones.length > 0) reproducirCancion(0);
                    return;
                }
                audioPlayer.play();
                playBtn.textContent = "⏸";
            } else {
                audioPlayer.pause();
                playBtn.textContent = "▶";
            }
        }
        window.togglePlay = togglePlay;

        function nextSong() {
            if (currentIndex + 1 < canciones.length) reproducirCancion(currentIndex + 1);
        }

        function prevSong() {
            if (currentIndex - 1 >= 0) reproducirCancion(currentIndex - 1);
        }

        audioPlayer.addEventListener('ended', nextSong);
    </script>
</body>
</html>
